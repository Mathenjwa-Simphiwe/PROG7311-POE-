version: "3.9"

services:

  # ── Container 1: SQL Server Database ──────────────────────────────────────
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "GLMS_Strong@Pass1"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - glms-network
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "GLMS_Strong@Pass1", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── Container 2: TechMove Web API (Backend) ────────────────────────────────
  glms-backend-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: glms-backend-api
    depends_on:
      sql-server-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      UseInMemoryDatabase: "false"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=GLMS_DB;User Id=sa;Password=GLMS_Strong@Pass1;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "this-is-a-very-long-secret-key-32-chars-minimum-12345"
      Jwt__Issuer: "GLMS.API"
      Jwt__Audience: "GLMS.Client"
      MvcClient__BaseUrl: "http://glms-frontend-web:8080"
    ports:
      - "5000:8080"
    volumes:
      - api-uploads:/app/uploads
    networks:
      - glms-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger/v1/swagger.json || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Container 3: PROGPOE MVC App (Frontend) ────────────────────────────────
  glms-frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.mvc
    container_name: glms-frontend-web
    depends_on:
      glms-backend-api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TechMoveApi__BaseUrl: "http://glms-backend-api:8080"
    ports:
      - "8081:8080"
    networks:
      - glms-network

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  sqldata:
  api-uploads:

# ── Internal Network ──────────────────────────────────────────────────────────
networks:
  glms-network:
    driver: bridge
